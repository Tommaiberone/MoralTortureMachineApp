# Read-only CloudWatch Logs diagnostic. Manual only - never runs on push.
# Uses the same scoped deploy AWS credentials as deploy.yml, so this never
# needs a local AWS credential (see ADR-092: local credentials for this
# account are root, which CLAUDE.md forbids for routine/automation use).
name: Tail Backend Logs

on:
  workflow_dispatch:
    inputs:
      log_group:
        description: 'CloudWatch log group to read'
        required: false
        default: '/aws/lambda/moral-torture-machine-api'
        type: choice
        options:
          - /aws/lambda/moral-torture-machine-api
          - /aws/lambda/moral-torture-machine-retention-sweep
          - /aws/apigateway/moral-torture-machine-api
      scan_daily_moral_crime_votes:
        description: 'Also scan the prod-moral-torture-machine-daily-moral-crime-votes table (small, read-only) and print every item'
        required: false
        default: false
        type: boolean
      since:
        description: 'How far back to look (e.g. 1h, 30m, 2d)'
        required: false
        default: '1h'
      filter_pattern:
        description: 'CloudWatch Logs filter pattern (plain substring, or a CloudWatch filter expression). Leave empty for everything.'
        required: false
        default: ''

env:
  AWS_REGION: eu-west-1

jobs:
  tail:
    name: Tail ${{ github.event.inputs.log_group }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Tail logs
        run: |
          LOG_GROUP="${{ github.event.inputs.log_group }}"
          FILTER="${{ github.event.inputs.filter_pattern }}"
          echo "📋 Log group: $LOG_GROUP"
          echo "📋 Since: ${{ github.event.inputs.since }}"
          echo "📋 Filter: ${FILTER:-<none>}"
          echo "---"
          if [ -n "$FILTER" ]; then
            aws logs tail "$LOG_GROUP" --since "${{ github.event.inputs.since }}" --filter-pattern "$FILTER" --format short
          else
            aws logs tail "$LOG_GROUP" --since "${{ github.event.inputs.since }}" --format short
          fi
      - name: Isolated UpdateItem repro test (scratch key, self-cleaning)
        if: ${{ github.event.inputs.scan_daily_moral_crime_votes == 'true' }}
        run: |
          TABLE="prod-moral-torture-machine-daily-moral-crime-votes"
          echo "--- update-item with the exact SET+ADD expression against a scratch key ---"
          set +e
          aws dynamodb update-item --table-name "$TABLE" \
            --key '{"dayKey":{"S":"__diag__"},"entryKey":{"S":"__diag_aggregate__"}}' \
            --update-expression 'SET dilemmaBaseId = :base_id, updatedAt = :now, expirationTime = :expires ADD #votes :increment' \
            --expression-attribute-names '{"#votes":"firstVotes"}' \
            --expression-attribute-values '{":base_id":{"S":"diag"},":now":{"N":"1"},":expires":{"N":"2"},":increment":{"N":"1"}}' \
            --return-values ALL_NEW
          echo "exit code: $?"
          echo "--- cleanup ---"
          aws dynamodb delete-item --table-name "$TABLE" \
            --key '{"dayKey":{"S":"__diag__"},"entryKey":{"S":"__diag_aggregate__"}}'
          echo "--- transact-write-items with ONLY the Update action (single-item transaction) ---"
          aws dynamodb transact-write-items --transact-items '[{
            "Update": {
              "TableName": "'"$TABLE"'",
              "Key": {"dayKey":{"S":"__diag__"},"entryKey":{"S":"__diag_aggregate__"}},
              "UpdateExpression": "SET dilemmaBaseId = :base_id, updatedAt = :now, expirationTime = :expires ADD #votes :increment",
              "ExpressionAttributeNames": {"#votes":"firstVotes"},
              "ExpressionAttributeValues": {":base_id":{"S":"diag"},":now":{"N":"1"},":expires":{"N":"2"},":increment":{"N":"1"}}
            }
          }]'
          echo "exit code: $?"
          echo "--- cleanup 2 ---"
          aws dynamodb delete-item --table-name "$TABLE" \
            --key '{"dayKey":{"S":"__diag__"},"entryKey":{"S":"__diag_aggregate__"}}'
          echo "--- transact-write-items with Put + Update together (matches the real code) ---"
          aws dynamodb transact-write-items --transact-items '[
            {
              "Put": {
                "TableName": "'"$TABLE"'",
                "Item": {"dayKey":{"S":"__diag__"},"entryKey":{"S":"participant#__diag__"},"anonymousUserId":{"S":"__diag__"},"choice":{"S":"first"},"dilemmaBaseId":{"S":"diag"},"createdAt":{"N":"1"},"expirationTime":{"N":"2"}},
                "ConditionExpression": "attribute_not_exists(dayKey) AND attribute_not_exists(entryKey)"
              }
            },
            {
              "Update": {
                "TableName": "'"$TABLE"'",
                "Key": {"dayKey":{"S":"__diag__"},"entryKey":{"S":"__diag_aggregate__"}},
                "UpdateExpression": "SET dilemmaBaseId = :base_id, updatedAt = :now, expirationTime = :expires ADD #votes :increment",
                "ExpressionAttributeNames": {"#votes":"firstVotes"},
                "ExpressionAttributeValues": {":base_id":{"S":"diag"},":now":{"N":"1"},":expires":{"N":"2"},":increment":{"N":"1"}}
              }
            }
          ]'
          echo "exit code: $?"
          echo "--- cleanup 3 ---"
          aws dynamodb delete-item --table-name "$TABLE" --key '{"dayKey":{"S":"__diag__"},"entryKey":{"S":"__diag_aggregate__"}}'
          aws dynamodb delete-item --table-name "$TABLE" --key '{"dayKey":{"S":"__diag__"},"entryKey":{"S":"participant#__diag__"}}'
          set -e
      - name: Scan daily_moral_crime_votes (read-only)
        if: ${{ github.event.inputs.scan_daily_moral_crime_votes == 'true' }}
        run: |
          TABLE="prod-moral-torture-machine-daily-moral-crime-votes"
          echo "📋 Scanning $TABLE (read-only, no writes)"
          echo "--- describe-table ---"
          aws dynamodb describe-table --table-name "$TABLE" \
            --query 'Table.{Status:TableStatus,ItemCount:ItemCount,GSIs:GlobalSecondaryIndexes[].{Name:IndexName,Status:IndexStatus}}'
          echo "--- scan (all items, raw AttributeValue shape) ---"
          aws dynamodb scan --table-name "$TABLE"
