# Deploy the production backend, web app, and Android artifacts.
name: Deploy Full Stack

# AWS has one production stack. Local development never provisions cloud resources.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      populate_dynamodb:
        description: 'Populate DynamoDB with fresh data'
        required: false
        default: false
        type: boolean
      invalidate_cache:
        description: 'Invalidate CloudFront cache'
        required: false
        default: true
        type: boolean
      publish_to_play_store:
        description: 'Publish the signed AAB to Google Play (requires a prior manual release on the target track)'
        required: false
        default: false
        type: boolean
      play_store_track:
        description: 'Google Play track to publish to'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

env:
  AWS_REGION: eu-west-1
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  TERRAFORM_VERSION: 1.9.0
  TF_VERSION_FRONTEND: '1.9.5'

jobs:
  # Job 0: Publish the single allowed cloud environment.
  setup:
    name: Setup Production
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      dynamodb_table: ${{ steps.set-env.outputs.dynamodb_table }}
      android_version_bumped: ${{ steps.check-version.outputs.bumped }}

    steps:
      - name: Set production environment
        id: set-env
        run: |
          echo "environment=prod" >> $GITHUB_OUTPUT
          echo "🎯 Deploying the production stack"

      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Auto-publish only fires when this push actually raised versionCode,
      # so ordinary commits never attempt a duplicate Play Store upload.
      - name: Check Android version bump
        id: check-version
        run: |
          BUMPED=false
          if [ "${{ github.event_name }}" == "push" ] && \
             [ -n "${{ github.event.before }}" ] && \
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- frontend/android/app/build.gradle | grep -q .; then
              OLD_VC=$(git show ${{ github.event.before }}:frontend/android/app/build.gradle 2>/dev/null | grep -oP 'versionCode\s+\K[0-9]+' || echo 0)
              NEW_VC=$(git show ${{ github.sha }}:frontend/android/app/build.gradle 2>/dev/null | grep -oP 'versionCode\s+\K[0-9]+' || echo 0)
              if [ "$NEW_VC" -gt "$OLD_VC" ]; then
                BUMPED=true
                echo "✅ Android versionCode bumped: $OLD_VC -> $NEW_VC"
              fi
            fi
          fi
          echo "bumped=$BUMPED" >> $GITHUB_OUTPUT

  # Job 1: Lint e Test Backend
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: false # Disabilitato cache perché non esiste uv.lock

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Lint with ruff
        continue-on-error: true
        run: |
          uv pip install --system ruff
          ruff check . || true

      - name: Check Python syntax
        run: |
          python -m py_compile src/backend_fastapi.py
          python -m py_compile scripts/populate_dynamodb_multilang.py
          python -m py_compile scripts/populate_story_flows.py

      - name: Run backend unit tests
        run: cd .. && python -m unittest backend.tests.test_analytics_models

  # Job 2: Deploy Backend
  backend-deploy:
    name: Deploy Backend (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, backend-lint-test]
    defaults:
      run:
        working-directory: ./backend

    permissions:
      contents: read
      id-token: write

    outputs:
      api_url: ${{ steps.api-endpoint.outputs.api_url }}
      cognito_domain: ${{ steps.api-endpoint.outputs.cognito_domain }}
      cognito_client_id: ${{ steps.api-endpoint.outputs.cognito_client_id }}
      cognito_native_client_id: ${{ steps.api-endpoint.outputs.cognito_native_client_id }}

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: false

      - name: Build Lambda package
        run: |
          rm -rf lambda_deployment lambda_function.zip
          mkdir -p lambda_deployment
          cp src/backend_fastapi.py lambda_deployment/
          cp src/archetype_engine.py lambda_deployment/
          cp src/compatibility_engine.py lambda_deployment/
          cp src/party_awards.py lambda_deployment/
          cp data/archetypes.json lambda_deployment/
          cp data/daily_moral_crime_v1.json lambda_deployment/

          uv pip install \
            --target lambda_deployment \
            --python-platform manylinux2014_x86_64 \
            --python-version ${{ env.PYTHON_VERSION }} \
            --no-installer-metadata \
            -r requirements.txt

          cd lambda_deployment && zip -q -r ../lambda_function.zip . && cd ..
          echo "📦 Lambda package size: $(du -h lambda_function.zip | cut -f1)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Update SSM Parameter (Groq API Key)
        run: |
          SSM_NAME="/${{ needs.setup.outputs.environment }}/moral-torture-machine/groq-api-key"
          aws ssm put-parameter \
            --name "$SSM_NAME" \
            --type SecureString \
            --value "${{ secrets.GROQ_API_KEY }}" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          echo "✅ SSM parameter updated: $SSM_NAME"

      - name: Terraform Init & Apply
        working-directory: ./backend/terraform
        env:
          TF_VAR_environment: ${{ needs.setup.outputs.environment }}
          TF_VAR_stack_name: moral-torture-machine
          TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          terraform init

          # Only the production workspace is allowed for cloud deployments.
          terraform workspace select prod

          # Apply (manages DynamoDB + SSM + Lambda + API Gateway)
          terraform apply -auto-approve

      - name: Get API Endpoint
        id: api-endpoint
        working-directory: ./backend/terraform
        run: |
          API_URL=$(terraform output -raw api_endpoint)
          COGNITO_DOMAIN=$(terraform output -raw cognito_domain)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_web_client_id)
          COGNITO_NATIVE_CLIENT_ID=$(terraform output -raw cognito_android_client_id)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "cognito_domain=$COGNITO_DOMAIN" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$COGNITO_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "cognito_native_client_id=$COGNITO_NATIVE_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "✅ API Endpoint: $API_URL"

      - name: Test API Health
        run: |
          API_URL="${{ steps.api-endpoint.outputs.api_url }}"
          echo "🧪 Testing API at: $API_URL"
          sleep 5

          curl -f -s --retry 3 --retry-delay 5 "$API_URL/" || exit 1

          RESPONSE=$(curl -s --retry 3 --retry-delay 5 "$API_URL/health")
          echo "Health check response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('status') in ['healthy','degraded'] else 1)"
          echo "✅ API health check passed!"

      - name: Cleanup Lambda package
        if: always()
        run: |
          rm -rf lambda_function.zip lambda_deployment
          echo "🧹 Cleaned up temporary Lambda files"

  # Job 3: Deploy Frontend Infrastructure
  frontend-infrastructure:
    name: Frontend Infrastructure (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: setup
    defaults:
      run:
        working-directory: frontend/terraform

    permissions:
      contents: read
      id-token: write

    outputs:
      bucket_name: ${{ steps.outputs.outputs.bucket_name }}
      distribution_id: ${{ steps.outputs.outputs.distribution_id }}
      frontend_url: ${{ steps.outputs.outputs.frontend_url }}

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION_FRONTEND }}

      - name: Terraform Init & Apply
        env:
          TF_VAR_environment: ${{ needs.setup.outputs.environment }}
          TF_VAR_stack_name: moral-torture-machine
          TF_VAR_domain_name: moraltorturemachine.com
          TF_VAR_use_custom_domain: 'true'
        run: |
          terraform init

          # Only the production workspace is allowed for cloud deployments.
          terraform workspace select prod

          # Apply with environment variables
          terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: outputs
        run: |
          echo "bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT

  # Job 4: Build e Deploy Frontend
  frontend-deploy:
    name: Build & Deploy Frontend (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, frontend-infrastructure, backend-deploy]

    permissions:
      contents: read
      id-token: write

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Read app version
        id: app_version
        working-directory: frontend
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.app_version.outputs.version }}
          VITE_COGNITO_DOMAIN: ${{ needs.backend-deploy.outputs.cognito_domain }}
          VITE_COGNITO_CLIENT_ID: ${{ needs.backend-deploy.outputs.cognito_client_id }}
          VITE_COGNITO_NATIVE_CLIENT_ID: ${{ needs.backend-deploy.outputs.cognito_native_client_id }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
        run: pnpm build --mode prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ needs.frontend-infrastructure.outputs.bucket_name }}/ --delete

      - name: Invalidate CloudFront cache
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.invalidate_cache == 'true')
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.frontend-infrastructure.outputs.distribution_id }} \
            --paths "/*"

  # Job 4b: Build Android artifacts for the production client.
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [setup, frontend-infrastructure, backend-deploy]

    permissions:
      contents: write # Per upload release artifacts

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Setup Java (for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Read app version
        id: app_version
        working-directory: frontend
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web app
        working-directory: frontend
        env:
          VITE_API_URL: ${{ needs.backend-deploy.outputs.api_url }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.version }}
          VITE_COGNITO_DOMAIN: ${{ needs.backend-deploy.outputs.cognito_domain }}
          VITE_COGNITO_CLIENT_ID: ${{ needs.backend-deploy.outputs.cognito_client_id }}
          VITE_COGNITO_NATIVE_CLIENT_ID: ${{ needs.backend-deploy.outputs.cognito_native_client_id }}
        run: pnpm build --mode prod

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: frontend
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Decode keystore and create key.properties
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Decode keystore from base64
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks

          # Create key.properties file
          cat > key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "✅ Keystore decoded and key.properties created"

      - name: Build Android App Bundle (AAB)
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Cleanup sensitive files
        if: always()
        working-directory: frontend/android
        run: |
          rm -f upload-keystore.jks key.properties
          echo "🧹 Cleaned up keystore and key.properties"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Get APK info
        id: apk-info
        working-directory: frontend
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          AAB_SIZE=$(du -h "$AAB_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT
          echo "✅ APK built successfully! Size: $APK_SIZE"
          echo "✅ AAB built successfully! Size: $AAB_SIZE"

      - name: Comment on commit with APK download link
        uses: actions/github-script@v7
        with:
          script: |
            const apkSize = '${{ steps.apk-info.outputs.apk_size }}';
            const aabSize = '${{ steps.apk-info.outputs.aab_size }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `📱 **Android Builds Completed!**\n\n` +
                    `✅ APK (Debug): ${apkSize}\n` +
                    `✅ AAB (Release): ${aabSize}\n\n` +
                    `📦 [Download from Actions artifacts](${runUrl})\n\n` +
                    `**Note:** Use AAB for Play Store submission\n\n` +
                    `_Build triggered by: ${context.actor}_`
            });

  # Job 4c: Publish the signed AAB to Google Play. Fires automatically on a
  # push to main that bumps versionCode (straight to production, no human
  # gate — see ADR-017), or on a manual workflow_dispatch with the flag on
  # (track selectable, for ad-hoc tests against internal/alpha/beta).
  play-store-publish:
    name: Publish to Google Play (${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.play_store_track) || 'production' }})
    runs-on: ubuntu-latest
    needs: [setup, android-build]
    if: |
      (github.event_name == 'push' && needs.setup.outputs.android_version_bumped == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_play_store == 'true')

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-app-bundle
          path: android-release

      - name: Publish AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.tommaiberone.MoralTortureMachine
          releaseFiles: android-release/app-release.aab
          track: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.play_store_track) || 'production' }}
          status: completed

  # Job 5: Populate DynamoDB (opzionale)
  populate-dynamodb:
    name: Populate DynamoDB (${{ needs.setup.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [setup, backend-deploy]
    if: |
      needs.backend-deploy.result == 'success' &&
      (contains(github.event.head_commit.message, '[populate-db]') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.populate_dynamodb == 'true'))

    environment:
      name: ${{ needs.setup.outputs.environment }}

    steps:
      # ... (steps del job populate-dynamodb rimangono invariati)
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install dependencies
        run: pip install boto3 jq
      - name: Check dilemma files
        working-directory: backend
        run: |
          echo "📋 Checking dilemma files..."
          if [ -f "data/dilemmas_it.json" ] && [ -f "data/dilemmas_en.json" ]; then
            echo "MULTILANG=true" >> $GITHUB_ENV
            en_count=$(jq '. | length' data/dilemmas_en.json)
            it_count=$(jq '. | length' data/dilemmas_it.json)
            echo "✅ Found $en_count English + $it_count Italian dilemmas"
          elif [ -f "data/dilemmas_en.json" ]; then
            echo "MULTILANG=false" >> $GITHUB_ENV
            count=$(jq '. | length' data/dilemmas_en.json)
            echo "✅ Found $count dilemmas"
          else
            echo "❌ No dilemma files found!"
            exit 1
          fi

          echo "📖 Checking story flow files..."
          if [ -f "data/story_flows_it.json" ] && [ -f "data/story_flows_en.json" ]; then
            en_flows=$(jq '. | length' data/story_flows_en.json)
            it_flows=$(jq '. | length' data/story_flows_it.json)
            echo "✅ Found $en_flows English + $it_flows Italian story flows"
          else
            echo "⚠️ No story flow files found (optional)"
          fi
      - name: Backup DynamoDB
        run: |
          timestamp=$(date +%Y%m%d-%H%M%S)
          TABLE_NAME="${{ needs.setup.outputs.environment }}-moral-torture-machine-dilemmas"
          aws dynamodb create-backup --table-name $TABLE_NAME --backup-name "backup-$timestamp" --region ${{ env.AWS_REGION }}
          echo "💾 Backup created: backup-$timestamp"
      - name: Populate DynamoDB Dilemmas
        working-directory: backend
        run: |
          echo "📊 Populating DynamoDB dilemmas..."
          TABLE_NAME="${{ needs.setup.outputs.environment }}-moral-torture-machine-dilemmas"
          python3 -u scripts/populate_dynamodb_multilang.py --auto-confirm $TABLE_NAME
          echo "✅ DynamoDB dilemmas populated!"
      - name: Populate DynamoDB Story Flows
        working-directory: backend
        run: |
          echo "📖 Populating DynamoDB story flows..."
          TABLE_NAME="${{ needs.setup.outputs.environment }}-moral-torture-machine-story-flows"

          echo "DEBUG: Table name: $TABLE_NAME"
          echo "DEBUG: Checking if JSON files exist..."
          ls -la data/story_flows_*.json

          python3 -u scripts/populate_story_flows.py --auto-confirm $TABLE_NAME
          POPULATE_EXIT_CODE=$?

          echo "DEBUG: Populate script exit code: $POPULATE_EXIT_CODE"

          if [ $POPULATE_EXIT_CODE -ne 0 ]; then
            echo "❌ Populate script failed with exit code $POPULATE_EXIT_CODE"
            exit 1
          fi

          echo "✅ DynamoDB story flows populated!"

          echo "DEBUG: Immediately checking table contents..."
          aws dynamodb scan --table-name $TABLE_NAME --region ${{ env.AWS_REGION }} --select COUNT --query 'Count' --output text
      - name: Verify population
        run: |
          echo "🔍 Verifying dilemmas table..."
          DILEMMAS_TABLE="${{ needs.setup.outputs.environment }}-moral-torture-machine-dilemmas"
          dilemmas_total=$(aws dynamodb scan --table-name $DILEMMAS_TABLE --region ${{ env.AWS_REGION }} --select COUNT --query 'Count' --output text)
          echo "📊 Total dilemmas: $dilemmas_total"

          echo "🔍 Verifying story flows table..."
          FLOWS_TABLE="${{ needs.setup.outputs.environment }}-moral-torture-machine-story-flows"
          flows_total=$(aws dynamodb scan --table-name $FLOWS_TABLE --region ${{ env.AWS_REGION }} --select COUNT --query 'Count' --output text)
          echo "📊 Total story flows: $flows_total"

          if [ "$dilemmas_total" -eq 0 ]; then
            echo "❌ No dilemmas in table!"
            exit 1
          fi

          if [ "$flows_total" -eq 0 ]; then
            echo "❌ No story flows in table!"
            exit 1
          fi

          echo "✅ All tables populated successfully!"

  # Job 6: Summary e Notifiche
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [setup, backend-deploy, frontend-deploy, android-build, play-store-publish]
    if: always() # Esegui sempre per dare un feedback

    steps:
      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 Deployment Summary for commit ${{ github.sha }}

          **Environment:** ${{ needs.setup.outputs.environment }}

          ### Backend (DynamoDB + SSM)
          $(if [ "${{ needs.backend-deploy.result }}" == "success" ]; then
            echo "✅ **Deployed successfully**"
          else
            echo "❌ **Failed**"
          fi)

          ### Frontend
          $(if [ "${{ needs.frontend-deploy.result }}" == "success" ]; then
            echo "✅ **Deployed successfully**"
            echo "**Frontend URL:** \`${{ needs.frontend-infrastructure.outputs.frontend_url }}\`"
            echo "**S3 Bucket:** \`${{ needs.frontend-infrastructure.outputs.bucket_name }}\`"
          else
            echo "❌ **Failed**"
          fi)

          ### Android APK
          $(if [ "${{ needs.android-build.result }}" == "success" ]; then
            echo "✅ **Built successfully**"
            echo "📦 **Download from:** [Actions Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            echo "❌ **Failed**"
          fi)

          ### Google Play publish
          $(if [ "${{ needs.play-store-publish.result }}" == "success" ]; then
            echo "✅ **Published to track:** \`${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.play_store_track) || 'production' }}\`"
          elif [ "${{ needs.play-store-publish.result }}" == "skipped" ]; then
            echo "⏭️ **Skipped** (no versionCode bump detected on this push, and not requested via workflow_dispatch)"
          else
            echo "❌ **Failed**"
          fi)
          EOF

      - name: Notify Failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Uno o più job sono falliti. Controlla i log per i dettagli." >> $GITHUB_STEP_SUMMARY
