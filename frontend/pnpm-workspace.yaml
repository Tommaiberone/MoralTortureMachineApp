packages:
  - 'frontend'

allowBuilds:
  # esbuild's postinstall script only downloads the prebuilt native binary
  # for the current platform (no arbitrary code beyond that) and Vite
  # cannot build/dev without it - blocking it breaks the toolchain outright,
  # unlike sharp below which this project doesn't depend on at build time.
  esbuild: true

ignoredBuiltDependencies:
  - sharp

overrides:
  # TASK-117: recharts@2.15.x pins lodash ^4.17.21, which is vulnerable to
  # prototype pollution (CVE range <=4.17.23). 4.18.1 is the first published
  # fix and still satisfies recharts' own declared range.
  lodash: '^4.18.1'
